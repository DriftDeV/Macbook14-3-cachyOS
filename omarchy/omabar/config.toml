# OmaBar: configurazione predefinita (installata in /usr/share/omabar/config.toml).
# Per cambiarla copia questo file in /etc/omabar/config.toml: lì ogni sezione che scrivi sostituisce quella
# predefinita, e OmaBar lo rilegge da solo quando lo salvi.

[display]
brightness = 255      # 1-255 (255 = luminosità piena del pannello), in software: il T1 non espone una retroilluminazione
follow_screen = true  # la barra segue la luminosità dello schermo, da min_brightness (schermo al minimo) a brightness
min_brightness = 40
pixel_shift = true    # sposta il disegno di qualche pixel ogni 2 minuti, contro il burn-in dell'OLED
font = "sans-serif"
font_size = 26
fade_ms = 300         # dissolvenza tra i colori al cambio di tema (0 = cambio secco)

[theme]
# colors.toml del tema attivo, copiato qui dalla sessione utente (omabar-theme-sync). Se manca: colori neutri.
path = "/run/omabar/theme.toml"
bar = "theme"         # "theme": fondo dal tema; "black": nero vero (consuma meno, nessun burn-in del fondo)
outlines = true       # false: i tasti a riposo non hanno sfondo, solo icona o testo

# Livelli: il primo è quello normale, il secondo compare tenendo premuto Fn.
# Ogni tasto ha una sola faccia: label, icon (nome di un'icona simbolica o percorso di un SVG), clock (formato
# strftime) oppure battery = true; senza faccia è uno spazio vuoto, gap = true un separatore stretto tra gruppi. keys sono i tasti inviati al tocco
# (nomi di input-linux: Esc, F1, VolumeUp, PlayPause, ...). width = quanti posti occupa (anche 1.5).
# media = true mostra il brano in riproduzione (da omabar-agent); icon_playing sostituisce icon mentre un lettore
# suona (per esempio la pausa al posto del play).
[[layer]]
name = "sistema"
buttons = [
  { label = "esc", keys = ["Esc"] },
  { icon = "display-brightness-symbolic", icon_size = 30, keys = ["BrightnessDown"] },
  { icon = "display-brightness-symbolic", icon_size = 42, keys = ["BrightnessUp"] },
  { icon = "keyboard-brightness-symbolic", icon_size = 30, keys = ["IllumDown"] },
  { icon = "keyboard-brightness-symbolic", icon_size = 42, keys = ["IllumUp"] },
  { media = true, width = 3.5 },
  { icon = "media-skip-backward-symbolic", keys = ["PreviousSong"] },
  { icon = "media-playback-start-symbolic", icon_playing = "media-playback-pause-symbolic", keys = ["PlayPause"] },
  { icon = "media-skip-forward-symbolic", keys = ["NextSong"] },
  { icon = "audio-volume-muted-symbolic", keys = ["Mute"] },
  { icon = "audio-volume-low-symbolic", keys = ["VolumeDown"] },
  { icon = "audio-volume-high-symbolic", keys = ["VolumeUp"] },
  { clock = "%H:%M  %a %-d", width = 1.8 },
  { battery = true, width = 1.3 },
]

[[layer]]
name = "tasti funzione"
buttons = [
  { label = "esc", keys = ["Esc"] },
  { label = "F1", keys = ["F1"] },
  { label = "F2", keys = ["F2"] },
  { label = "F3", keys = ["F3"] },
  { label = "F4", keys = ["F4"] },
  { label = "F5", keys = ["F5"] },
  { label = "F6", keys = ["F6"] },
  { label = "F7", keys = ["F7"] },
  { label = "F8", keys = ["F8"] },
  { label = "F9", keys = ["F9"] },
  { label = "F10", keys = ["F10"] },
  { label = "F11", keys = ["F11"] },
  { label = "F12", keys = ["F12"] },
]

# Sessione bloccata: questo livello sostituisce gli altri e non invia tasti (niente F1-F12 o media sulla schermata
# di blocco). Senza omabar-agent la barra non sa del blocco e resta normale.
[lock]
name = "bloccato"
buttons = [
  { icon = "system-lock-screen-symbolic", icon_size = 32 },
  { media = true, width = 9 },
  { clock = "%H:%M  %a %-d", width = 1.8 },
  { battery = true, width = 1.3 },
]
