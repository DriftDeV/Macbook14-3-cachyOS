# Wi-Fi BCM43602 (brcmfmac) del MacBookPro14,3.
#
# brcmfmac fallisce la scansione che NetworkManager fa subito dopo aver messo un MAC casuale
# (wpa_supplicant: CTRL-EVENT-SCAN-FAILED ret=-22); il nuovo tentativo torna senza le reti a
# 5 GHz. Fonte: mihneadevries/mbp14-3-linux-wifi-fix (files/90-mbp-wifi.conf).
[device-macbookpro14-3-wifi]
match-device=driver:brcmfmac
wifi.scan-rand-mac-address=no

# Il file NVRAM generato porta il MAC di default Broadcom (00:90:4c:0d:f4:3e), uguale su ogni
# 14,3: un MAC stabile per macchina e rete evita collisioni. Fonte: dnlbtz/mbp143-wifi
# (conf/macbookWifiStableMac.conf, MIT).
[connection-macbookpro14-3-wifi]
match-device=driver:brcmfmac
wifi.cloned-mac-address=stable
