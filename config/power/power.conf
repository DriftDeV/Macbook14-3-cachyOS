# Impostazioni energetiche del MacBookPro14,3 per alimentazione (scripts/install-power.sh). Si cambiano da MacBook
# Manager (schede CPU e GPU) o a mano, poi: sudo /usr/local/lib/macbookpro14-3/power-source.sh
# Le chiavi AC_* valgono con l'alimentatore, BATTERY_* a batteria. Misure in docs/power.md.

# Radeon a batteria: low (clock al minimo), save (POWER_SAVING, -1,5 W a riposo), auto (come con l'alimentatore)
BATTERY_RADEON_MODE=low
# Turbo della CPU (1 = spento): a riposo non cambia nulla, sotto carico taglia i picchi di consumo e di calore
AC_NO_TURBO=0
BATTERY_NO_TURBO=1
# Frequenza massima della CPU in % (100 = 3,9 GHz con il turbo)
AC_CPU_MAX_PCT=100
BATTERY_CPU_MAX_PCT=100
# Profilo di power-profiles-daemon: keep (non cambiarlo), performance, balanced, power-saver
AC_CPU_PROFILE=keep
BATTERY_CPU_PROFILE=keep
# Limite di potenza a lungo termine della CPU in W (RAPL PL1; 0 = firmware, 100 W)
AC_CPU_POWER_W=0
BATTERY_CPU_POWER_W=0
# Tetto di temperatura della CPU in °C (0 = nessuno), applicato da macbookpro14-3-cpu-limit
AC_CPU_TEMP_LIMIT=0
BATTERY_CPU_TEMP_LIMIT=0
# Limite FPS dei giochi e delle app Vulkan (MangoHud; 0 = nessuno)
AC_FPS_LIMIT=0
BATTERY_FPS_LIMIT=60
