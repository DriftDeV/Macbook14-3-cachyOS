# Impostazioni energetiche del MacBookPro14,3 per alimentazione (scripts/install-power.sh).
# Modifica qui e riapplica con: sudo /usr/local/lib/macbookpro14-3/power-source.sh
#
# A batteria, Radeon in modalità manuale con profilo POWER_SAVING e PCIe al minimo
# (2,5 GT/s x8): -1,5 W misurati a riposo (docs/power.md). Con l'alimentatore torna su auto.
BATTERY_RADEON_SAVE=1
# A batteria, niente turbo della CPU (max 2,9 GHz invece di 3,9): a riposo non cambia
# nulla, sotto carico taglia i picchi di consumo e di calore. Metti 0 per tenerlo.
BATTERY_NO_TURBO=1
