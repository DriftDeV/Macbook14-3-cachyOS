# Limite FPS a batteria (MacBook Manager, scheda GPU): il layer Vulkan di MangoHud in tutte le app, con l'HUD nascosto
# e il limite scritto da power-source.sh in /etc/macbookpro14-3/mangohud.conf a ogni cambio di alimentazione (i giochi
# già aperti lo rileggono da soli). Vale dalla prossima sessione. Installato da scripts/install-power.sh.
MANGOHUD=1
MANGOHUD_CONFIGFILE=/etc/macbookpro14-3/mangohud.conf
