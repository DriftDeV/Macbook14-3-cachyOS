# MacBookPro14,3: buffer minimo dei programmi PulseAudio (Claude Desktop, browser, Discord, app Electron) a 1024
# campioni (~21 ms) invece di 512. Con il filtro degli altoparlanti (mbp143-audio) e la CPU limitata a batteria,
# la voce sintetica di Claude Desktop (che chiede 512/48000) faceva schiocchi su più altoparlanti; con 1024 spariti
# (25/11/2026, docs/audio.md). Installato da scripts/install-audio-dsp.sh in /etc/pipewire/pipewire-pulse.conf.d/.
pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.frag    = 1024/48000
    pulse.min.quantum = 1024/48000
}
