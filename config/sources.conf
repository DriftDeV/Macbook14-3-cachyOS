# Sorgenti esterne usate da install.sh. Modificale qui, non nello script.
#
# ATTENZIONE: i riferimenti non sono "pinnati" a un commit perché la ricerca
# non ha potuto verificarli su hardware reale. Dopo il primo test riuscito su un
# MacBookPro14,3, sostituisci *_REF con lo SHA del commit che funziona.

# Touch Bar T1 (apple-ibridge / apple-ib-tb / apple-ib-als).
# Candidati: nonderbe (più completo per kernel 7.x, provato su 14,2),
# F13-Kr1pt0n (originale, non compila su 6.15+ senza le PR),
# AJ-dev-i60/t1-touchbar (provato su 14,3, kernel 7.0, Ubuntu).
# ATTENZIONE: il branch di default di nonderbe è identico a F13 (non compila su ≥6.15);
# le correzioni sono nel branch t1-fixes. Commit sotto = t1-fixes al 2026-10-18,
# compilato (con patches/touchbar/) su 7.3.5-cachyos e 6.18-cachyos-lts il 2026-11-23.
TOUCHBAR_REPO="https://github.com/nonderbe/macbook-pro-touchbar-driver.git"
TOUCHBAR_REF="2677d711a273fe8de07ba66a3f72b5ce7118e50c"

