# Bluetooth del MacBookPro14,3 (Broadcom su UART): il profilo headset (HSP/HFP) funziona solo
# con il codec CVSD; con mSBC resta muto (vedi docs/audio.md). Disattivando mSBC, il profilo
# "headset-head-unit" usa CVSD, anche quando un'app (es. Discord) lo attiva da sola.
# Installazione (da utente): ~/.config/wireplumber/wireplumber.conf.d/, poi
#   systemctl --user restart wireplumber
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
