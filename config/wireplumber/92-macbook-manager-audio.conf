# MacBook Manager, scheda Audio: riapplica al filtro degli altoparlanti (mbp143-audio) le impostazioni salvate
# (~/.local/state/wireplumber/macbook-manager-audio). Installato da scripts/install-manager.sh in
# /etc/wireplumber/wireplumber.conf.d/; lo script sta in /usr/local/share/wireplumber/scripts/macbook-manager/.
# "required": con "optional" WirePlumber non lo carica (nessun componente lo richiede). Configurazione e script si
# installano e si tolgono insieme (install-manager.sh e --undo).
wireplumber.components = [
  {
    name = macbook-manager/audio-settings.lua, type = script/lua
    provides = custom.macbook-manager-audio
  }
]

wireplumber.profiles = {
  main = {
    custom.macbook-manager-audio = required
  }
}
