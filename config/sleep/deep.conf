# S3 ("deep"), lo stato che usa macOS: il firmware spegne quasi tutto, ventole comprese.
# Copiato in /run/systemd/sleep.conf.d/ da macbookpro14-3-sleep-mode.service solo sui kernel dove è provato;
# ha la precedenza su 10-macbookpro14-3.conf (s2idle), che resta come ripiego. Vedi docs/sleep.md.
[Sleep]
MemorySleepMode=deep
