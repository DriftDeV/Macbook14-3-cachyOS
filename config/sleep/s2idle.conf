# Ripiego: s2idle. Sui kernel provati (>= 7.3) macbookpro14-3-sleep-mode.service aggiunge in /run un drop-in
# con MemorySleepMode=deep, che ha la precedenza (S3 ripreso bene sul 7.3.5, 23/11/2026).
# La fonte mihneadevries/mbp14-3-linux-sleep-fix (kernel 7.2) segnala che la ripresa da S3 fallisce in amdgpu
# ("SMU load firmware failed -22"): per questo i kernel non provati restano su s2idle.
[Sleep]
MemorySleepMode=s2idle
# Il ripristino dall'ibernazione incontra lo stesso errore di amdgpu. Da riabilitare solo
# con un kernel che contiene "drm/amdgpu: reset VI ASIC on Apple boards with VRAM at 0" [NV].
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
