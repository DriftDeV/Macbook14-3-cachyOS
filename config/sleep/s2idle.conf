# Sul 14,3 la ripresa da S3 ("deep", il default del firmware) fallisce in amdgpu
# (Radeon Pro 555/560: "SMU load firmware failed -22", poi timeout di sdma0): si usa s2idle,
# insieme all'hook macbookpro14-3-sleep.sh. Fonte: mihneadevries/mbp14-3-linux-sleep-fix.
[Sleep]
MemorySleepMode=s2idle
# Il ripristino dall'ibernazione incontra lo stesso errore di amdgpu. Da riabilitare solo
# con un kernel che contiene "drm/amdgpu: reset VI ASIC on Apple boards with VRAM at 0" [NV].
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
