name: ci
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintassi bash
        run: |
          for f in install.sh scripts/*.sh macos/prepare.sh config/sleep/*.sh config/tiny-dfr/tiny-dfr-touch; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x install.sh scripts/*.sh macos/prepare.sh config/sleep/*.sh config/tiny-dfr/tiny-dfr-touch
