# MangoHud (limite FPS a batteria, /etc/environment.d/90-macbookpro14-3-mangohud.conf) NON va caricato nel compositor:
# dentro kwin_wayland della schermata di login crollava (SIGSEGV in libMangoHud quando power-source.sh riscriveva il
# file del limite, SIGABRT all'uscita al momento del login; 25/11/2026). Le app lanciate dal desktop lo ricevono lo
# stesso: non sono figlie di KWin. Installato da scripts/install-power.sh come drop-in di plasma-kwin_wayland.service
# e plasma-login-kwin_wayland.service.
[Service]
UnsetEnvironment=MANGOHUD MANGOHUD_CONFIGFILE
