PACKAGE_NAME="apple-ibridge"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# NON VERIFICATO: nomi dei moduli e percorsi dipendono dal fork scelto
# (vedi config/sources.conf). Se il fork fornisce già un dkms.conf, install.sh
# usa quello e ignora questo file.
BUILT_MODULE_NAME[0]="apple-ibridge"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="apple-ib-tb"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="apple-ib-als"
DEST_MODULE_LOCATION[2]="/updates/dkms"
