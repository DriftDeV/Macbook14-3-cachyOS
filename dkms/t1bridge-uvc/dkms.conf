PACKAGE_NAME="t1bridge-uvc"
PACKAGE_VERSION="0.1.12"
# Per ogni kernel: sorgenti uvcvideo di quella versione da kernel.org (kernel-src.sh, con cache) + patch T1.
PRE_BUILD="prepare-src.sh ${kernelver}"
MAKE[0]="make KERNELRELEASE=${kernelver}"
BUILT_MODULE_NAME[0]="uvcvideo_t1"
BUILT_MODULE_LOCATION[0]="build/src"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
