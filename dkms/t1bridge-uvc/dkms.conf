PACKAGE_NAME="t1bridge-uvc"
PACKAGE_VERSION="0.1.12"
MAKE[0]="make KERNELRELEASE=${kernelver}"
BUILT_MODULE_NAME[0]="uvcvideo_t1"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
# Sorgenti di Linux 7.3: compilato solo per la serie 7.3 (con altre serie la modalità display
# resta senza webcam, la modalità tastiera non cambia).
BUILD_EXCLUSIVE_KERNEL="^7\.3\."
